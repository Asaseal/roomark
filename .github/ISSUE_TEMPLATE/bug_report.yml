name: Bug report
description: Report a reproducible problem in the current Roomark product
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove personal addresses, photos, tokens, and other sensitive data before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      options:
        - Android application
        - Web preview
        - Web furnishing
        - Product website
        - Backend
        - Build or release tooling
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Android/API version, device or emulator, browser, Rust, or Node version as relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove private data and secrets.
